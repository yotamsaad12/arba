# What each local authority adds to the base checklist for Form 4 / the completion certificate.
#
# Rules (as in contacts.yaml):
# - Only what the authority itself publishes. Every list has its source page and the date.
# - The base template already holds what applies everywhere (the statutory declarations ה-1 to
#   ה-7, water disinfection, waste disposal); list here only what is local.
#
# Each entry:
#   municipality: official authority code (סמל רשות), name for readers
#   requirements:
#     - key: stable id within this list
#       match: a template step key, to add documents to that step instead of a new step
#       title / stage / authority / documents / description / optional

- municipality: 5573  # מטה בנימין
  source_url: https://www.binyamin.org.il/7507/
  verified_at: 2026-10-23
  notes: הבקשה נפתחת בטופס מקוון רק כשעבודות הבנייה והפיתוח הסתיימו. ביקור שלישי של פקח בנכס בתשלום.
  requirements:
    - key: settlement_approval
      title: אישור היישוב למתן טופס 4
      stage: form4
      authority: municipality
      documents: [אישור יישוב למתן טופס 4]
    - key: radon
      title: אישור איגוד ערים לגז ראדון
      description: רק כשההיתר דורש בדיקת ראדון.
      stage: form4
      authority: testing_lab
      optional: true
      documents: [אישור איגוד ערים לגז ראדון]
    - key: gas
      match: gas
      documents: [תצהיר שאין מערכת גז (כשאין)]
    - key: concrete
      match: concrete_summary
      documents: [בדיקות בטון בכל הקומות כולל רצפה, קירות ותקרת הממ"ד]

- municipality: 831  # ירוחם
  source_url: https://handasa.yeroham.muni.il/wp-content/uploads/2026/06/ה-7-אחראי-לביקורת-על-הביצוע-בקשה-לקבלת-תעודת-גמר-עד-6-יחד.pdf
  verified_at: 2026-10-23
  notes: את כל המסמכים מגישים במייל מרוכז אחד, כל קובץ PDF בנפרד. תאגיד המים בודק עד 21 ימי עבודה.
  requirements:
    - key: developer
      title: התייחסות החברה המפתחת לפי השכונה
      description: בירוחם שתי חברות מפתחות, לפי השכונה. האופק והאגם - החברה הכלכלית; האירוסים, צהלה ונוף מדבר - משרד הבינוי והשיכון.
      stage: form4
      authority: municipality
      documents: [התייחסות החברה המפתחת]
    - key: structure_plans
      match: structure_supervision
      documents: [תוכניות קונסטרוקציה בקובצי PDF]
    - key: stone_cladding
      title: בדיקת חיפוי אבן בגדר הפונה לרחוב
      description: כשגובה הגדר עולה על 1.20 מ'.
      stage: finish
      authority: testing_lab
      optional: true
      documents: [דוח מעבדה מוסמכת לחיפוי אבן]
