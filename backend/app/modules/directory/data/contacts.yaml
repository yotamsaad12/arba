    יועץ בטיחות/עורך הבקשה, גלגילון כיבוי 3/4", והצהרת עורך הבקשה שהמבנה נבנה לפי התכניות
    שאושרו. מקור: מאגר "דרישות בטיחות אש להיתרי בניה" ב-data.gov.il.

