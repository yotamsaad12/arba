# Contacts of approving bodies, collected by hand from official websites.
#
# Rules:
# - Only what the body itself publishes. Every contact has the page it came from and the date.
# - Many bodies take requests through a form or portal, not email: record channel "portal".
# - Loaded by `python -m app.scripts.seed`; official contacts are replaced from this file on
#   every load. Contacts people added or Arba learned from filed mail are kept.
#
# Entry kinds:
#   committee: <planning committee name as in the official planning map>
#   type: <AuthorityType> + name: ... + areas: [municipality names] (or national: true)

