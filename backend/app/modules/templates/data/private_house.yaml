# תבנית: בית פרטי, תיק טופס 4.
#
# גרסה 3 (2026-10-23): הרשימה עוקבת אחרי המסמכים שתיק טופס 4 צריך, לפי גורם (עירייה/ועדה,
# פיקוד העורף, כבאות, תקשורת, מים, חשמל), ולא אחרי איכות הביצוע. השלב של כל מסמך אומר מתי
# משיגים אותו. מקורות:
#   - רשימת דרישות העירייה לטופס 4, בית פרטי (מגרש 551, הוועדה המקומית מיתר, נספחים 20-33).
#   - טופס הזמנת הג"א לביקורת ממ"ד, פיקוד העורף מחוז דרום (תקנה 5).
#   - דרישות בטיחות אש לבית חד/דו-משפחתי (data.gov.il, סיווג 01.01).
#   - תקנות התכנון והבנייה (רישוי בנייה) התשע"ו-2016, תקנה 95 (טפסים ה-1 עד ה-7).
#   - טופס 4 לבית פרטי, מטה בנימין: https://www.binyamin.org.il/7507/
# לכל רשות רשימה משלה: הלקוח מוסיף, משנה ומייבא את רשימת הרשות (Excel/PDF/מייל).
#
# שדות לכל דרישה (בנוסף ל-key, stage, title, authority, channel, days, depends_on, optional, gate):
#   track        של מי הרשימה: municipality | fire | home_front | water | electricity | telecom
#                | gas | developer | accessibility
#   standard     התקן הרלוונטי, למשל ת"י 4577
#   applies_if   תכונות של הפרויקט שהדרישה חלה רק כשהן קיימות (pool, gas, basement...)
#   fulfilled_by הושלם כשכל הרשימה של גורם אחר הושלמה (למשל אישור הג"א ← רשימת פיקוד העורף)

key: private_house
version: 3
name: בית פרטי
description: תיק טופס 4 לבית פרטי - כל המסמכים לפי גורם, מהיתר הבנייה ועד הגשת הבקשה.
client_type: private
building_type: private_house

stages:
  - key: pre
    title: לפני שמתחילים
    description: ההיתר, התוכניות המאושרות והמינויים שהוועדה דורשת.
  - key: foundations
    title: סימון ויסודות
    description: מפת הסימון ותעודות הבטון של היסודות.
  - key: skeleton
    title: שלד
    description: תעודות הבטון של כל קומה.
  - key: mamad
    title: ממ"ד
    description: המסמכים שפיקוד העורף דורש לאישור הממ"ד.
  - key: envelope
    title: מעטפת ואיטום
    description: בדיקות המעבדה לאיטום ולחיפוי, כשהן נדרשות.
  - key: systems
    title: מערכות
    description: מים, ביוב, חשמל, גז ודוד שמש.
  - key: finish
    title: גמר ומסירה
    description: מפת העדות, פינוי הפסולת, תמונות החזיתות והחברות שמחברות את הבית.
  - key: green
    title: בנייה ירוקה
    description: רק אם הרשות קובעת שתקן 5281 חל על הבית.
  - key: form4
    title: הגשה לטופס 4
    description: הדוחות המסכמים, אישורי הגורמים והבקשה לביקורת.

requirements:
  # --- לפני שמתחילים ---
  - key: permit
    stage: pre
    title: היתר בנייה בתוקף ורשימת התנאים שבו
    description: Arba קוראת את התנאים שבהיתר ומוסיפה אותם לרשימה.
    authority: municipality
    channel: in_person
    days: 3
    documents: [היתר בנייה, רשימת תנאי ההיתר]

  - key: plans
    stage: pre
    title: תיק תוכניות מאושר
    description: הגרמושקה - הגרסה שאושרה בהיתר. פיקוד העורף דורש גם את הדף הראשון עם חותמת הג"א.
    authority: municipality
    channel: in_person
    days: 3
    documents: [תוכנית אדריכלות, תוכנית קונסטרוקציה, תוכנית אינסטלציה, תוכנית חשמל]
    depends_on: [permit]

  - key: roles
    stage: pre
    title: מינוי האחראי לביקורת על הביצוע והאחראי לביצוע השלד
    description: כתבי המינוי שהוועדה דורשת לפני תחילת העבודות.
    authority: municipality
    channel: email
    days: 5
    documents: [כתב מינוי אחראי לביקורת על הביצוע, כתב מינוי אחראי לביצוע השלד]
    depends_on: [permit]

  - key: form4_list
    stage: pre
    title: קבלת רשימת האישורים לטופס 4 מהרשות
    description: לכל ועדה רשימה משלה. מעלים אותה ל-Arba והיא מעדכנת את התיק.
    authority: municipality
    channel: email
    days: 7
    documents: [רשימת דרישות לטופס 4]
    depends_on: [permit]

  - key: green_check
    stage: pre
    title: בירור ברשות אם חלות דרישות בנייה ירוקה
    authority: municipality
    channel: email
    days: 7
    optional: true
    depends_on: [permit]

  # --- סימון ויסודות ---
  - key: marking
    stage: foundations
    title: סימון המבנה במגרש על ידי מודד מוסמך
    authority: surveyor
    channel: email
    days: 2
    documents: [מפת סימון]
    depends_on: [plans]

  - key: concrete_foundations
    stage: foundations
    title: תעודות בטון - יסודות
    description: כלונסאות, קורות יסוד ורצפה. נכנסות לריכוז הבטון בסוף.
    authority: testing_lab
    channel: email
    days: 30
    standard: ת"י 26, ת"י 118
    documents: [תעודות בדיקת בטון]
    depends_on: [marking]

  # --- שלד ---
  - key: concrete_floor
    stage: skeleton
    title: תעודות בטון
    authority: testing_lab
    channel: email
    days: 30
    repeat: per_floor
    standard: ת"י 26, ת"י 118
    documents: [תעודות בדיקת בטון]
    depends_on: [concrete_foundations]
    previous_floor: [concrete_floor]

  # --- ממ"ד (רשימת פיקוד העורף) ---
  - key: hfc_order
    stage: mamad
    track: home_front
    title: טופס הזמנת הג"א לביקורת
    description: נשלח אחרי שכל העבודות בממ"ד הושלמו, יחד עם כל המסמכים ברשימה הזו.
    authority: owner
    channel: email
    days: 1
    documents: [טופס הזמנת ביקורת חתום]

  - key: hfc_plan_page
    stage: mamad
    track: home_front
    title: הדף הראשון מהגרמושקה עם חותמת הג"א
    description: גם התוכנית עם החותמת צריכה להיות בשטח ביום הבדיקה. בלעדיה הבדיקה לא תתבצע.
    authority: architect
    channel: email
    days: 1
    documents: [צילום הדף הראשון עם חותמת הג"א]
    depends_on: [plans]

  - key: hfc_structure
    stage: mamad
    track: home_front
    title: תצהיר האחראי לביצוע השלד (טופס 20 א')
    authority: structural_engineer
    channel: email
    days: 5
    documents: [תצהיר אחראי לביצוע השלד]
    depends_on: [concrete_foundations]

  - key: hfc_concrete
    stage: mamad
    track: home_front
    title: ריכוז תעודות בטון של הממ"ד (רצפה, קירות, תקרה)
    authority: testing_lab
    channel: email
    days: 5
    documents: [ריכוז תעודות בטון ממ"ד]
    depends_on: [concrete_foundations]

  - key: hfc_door_window
    stage: mamad
    track: home_front
    title: דוח התקנת דלת וחלון ממ"ד ואישור תווי תקן
    description: מהחברה שהתקינה. לפני בדיקת האטימות והתקנת מערכת האוורור והסינון.
    authority: contractor
    channel: email
    days: 5
    documents: [דוח התקנה ותווי תקן של הדלת והחלון]
    depends_on: [hfc_concrete]

  - key: hfc_sealing
    stage: mamad
    track: home_front
    title: בדיקת אטימות ממ"ד - מעבדה מאושרת
    authority: testing_lab
    channel: email
    days: 7
    standard: ת"י 4577
    documents: [דוח בדיקת אטימות]
    depends_on: [hfc_door_window]

  - key: hfc_plaster
    stage: mamad
    track: home_front
    title: בדיקת ציפויים וטיח בממ"ד - מעבדה מאושרת
    authority: testing_lab
    channel: email
    days: 7
    standard: ת"י 5075
    documents: [דוח בדיקת טיח]
    depends_on: [hfc_concrete]

  - key: hfc_ventilation
    stage: mamad
    track: home_front
    title: דוח התקנת מערכת אוורור וסינון
    authority: contractor
    channel: email
    days: 5
    documents: [דוח התקנת מערכת אוורור וסינון]
    depends_on: [hfc_sealing]

  - key: hfc_pipes
    stage: mamad
    track: home_front
    title: מעברי צנרת - אישור המתקין ואישור החומר
    description: רק אם בוצעו מעברי צנרת בקירות הממ"ד.
    authority: plumber
    channel: email
    days: 3
    optional: true
    documents: [אישור מתקין מעברי צנרת, אישור החומר]
    depends_on: [hfc_concrete]

  - key: hfc_electric
    stage: mamad
    track: home_front
    title: אישור חשמלאי מוסמך לעבודות חשמל ותקשורת בממ"ד
    authority: electrical_inspector
    channel: email
    days: 3
    documents: [אישור חשמלאי לממ"ד]
    depends_on: [hfc_concrete]

  - key: hfc_acoustic
    stage: mamad
    track: home_front
    title: בדיקת תקרה אקוסטית בממ"ד - מעבדה מאושרת
    authority: testing_lab
    channel: email
    days: 7
    applies_if: [acoustic_ceiling]
    documents: [דוח בדיקת תקרה אקוסטית]
    depends_on: [hfc_concrete]

  # --- מעטפת ואיטום ---
  - key: roof_flooding
    stage: envelope
    title: בדיקת הצפת גגות ומרפסות
    description: חלק מהוועדות דורשות גם בבית פרטי. אם לא ברשימת הוועדה, מסמנים "לא נדרש".
    authority: testing_lab
    channel: email
    days: 7
    optional: true
    standard: ת"י 1476
    documents: [דוח בדיקת הצפה]
    depends_on: [concrete_floor]

  - key: cladding
    stage: envelope
    title: בדיקת חיפוי אבן
    authority: testing_lab
    channel: email
    days: 7
    applies_if: [stone_cladding]
    standard: ת"י 2378, ת"י 1555
    documents: [דוח בדיקת חיפוי]
    depends_on: [concrete_floor]

  # --- מערכות ---
  - key: water_greywater
    stage: systems
    title: ריכוז בדיקות מים ודלוחין
    authority: plumber
    channel: email
    days: 5
    standard: ת"י 1205
    documents: [ריכוז בדיקות מים ודלוחין]
    depends_on: [concrete_floor]

  - key: sewage_external
    stage: systems
    title: ריכוז בדיקות ביוב חוץ
    authority: plumber
    channel: email
    days: 5
    standard: ת"י 1205
    documents: [ריכוז בדיקות ביוב חוץ]
    depends_on: [concrete_floor]

  - key: solar_heater
    stage: systems
    title: אישור מתקין מורשה לדוודים / מחמם מים
    authority: plumber
    channel: email
    days: 3
    standard: ת"י 579
    documents: [אישור התקנה ותו תקן לדוד]
    depends_on: [concrete_floor]

  - key: electrician
    stage: systems
    title: אישור חשמלאי מוסמך
    authority: electrical_inspector
    channel: email
    days: 3
    documents: [אישור חשמלאי]
    depends_on: [concrete_floor]

  - key: gas_check
    stage: systems
    title: אישור בדיקת מתקני גז (טופס ד')
    description: מחברת הגז שמספקת לבית, לפי ת"י 158.
    authority: gas_installer
    channel: email
    days: 5
    applies_if: [gas]
    standard: ת"י 158
    documents: [דוח בדיקת מתקן גז]
    depends_on: [concrete_floor]

  - key: electricity_inspection
    stage: systems
    track: electricity
    title: אישור בודק חשמל מוסמך לחיבור החשמל
    authority: electrical_inspector
    channel: email
    days: 7
    documents: [דוח בודק חשמל]
    depends_on: [electrician]

  # --- כבאות (בית חד/דו-משפחתי) ---
  - key: fire_detectors
    stage: systems
    track: fire
    title: גלאי עשן עצמאיים ותעודת תקן
    authority: contractor
    channel: email
    days: 3
    standard: ת"י 1220 חלק 5
    documents: [תעודת תקן לגלאים, תמונות הגלאים המותקנים]
    depends_on: [electrician]

  - key: fire_detectors_declaration
    stage: finish
    track: fire
    title: הצהרה על התקנת הגלאים לפי התקן
    description: של יועץ הבטיחות או של עורך הבקשה.
    authority: architect
    channel: email
    days: 3
    documents: [הצהרה על התקנת גלאים]
    depends_on: [fire_detectors]

  - key: fire_hose
    stage: systems
    track: fire
    title: גלגילון כיבוי "3/4
    authority: plumber
    channel: email
    days: 3
    documents: [אישור התקנת גלגילון]
    depends_on: [water_greywater]

  - key: fire_plans_declaration
    stage: finish
    track: fire
    title: הצהרת עורך הבקשה שהמבנה נבנה לפי התוכניות שאושרו
    authority: architect
    channel: email
    days: 3
    documents: [הצהרת עורך הבקשה]
    depends_on: [fire_detectors]

  - key: fire_pool
    stage: finish
    track: fire
    title: אישור יועץ בטיחות לבריכה ולגדרות
    authority: supervising_engineer
    channel: email
    days: 7
    applies_if: [pool]
    documents: [אישור יועץ בטיחות לבריכה]
    depends_on: [concrete_foundations]

  # --- גמר ומסירה ---
  - key: as_made
    stage: finish
    title: תוכנית עדות (AS MADE) - מודד מוסמך
    description: חתומה, בתוקף של עד שנה, בקובצי PDF ו-DWG.
    authority: surveyor
    channel: email
    days: 7
    documents: [מפת עדות חתומה, קובץ DWG]
    depends_on: [concrete_floor]

  - key: concrete_summary
    stage: finish
    title: ריכוז בדיקות בטון (מערך 1)
    description: מהמעבדה, מרכז את כל היציקות כולל הממ"ד.
    authority: testing_lab
    channel: email
    days: 5
    documents: [ריכוז בדיקות בטון]
    depends_on: [concrete_floor, hfc_concrete]

  - key: water_disinfection
    stage: finish
    title: אישור שטיפה וחיטוי של מערכת המים
    description: על ידי מורשה של משרד הבריאות.
    authority: plumber
    channel: email
    days: 3
    documents: [אישור שטיפה וחיטוי]
    depends_on: [water_greywater]

  - key: waste_disposal
    stage: finish
    title: אישור פינוי פסולת לאתר מוסדר
    authority: contractor
    channel: email
    days: 3
    documents: [אישור הטמנה ופינוי פסולת]
    depends_on: [concrete_floor]

  - key: facade_photos
    stage: finish
    title: תמונות חזיתות המבנה
    authority: owner
    channel: email
    days: 1
    documents: [תמונות החזיתות]
    depends_on: [as_made]

  - key: bezeq
    stage: finish
    track: telecom
    title: אישור בזק
    authority: contractor
    channel: email
    days: 14
    documents: [אישור בזק]
    depends_on: [concrete_floor]

  - key: hot
    stage: finish
    track: telecom
    title: אישור הוט / yes
    description: לפי ספק הטלוויזיה בבית. אם אין, מסמנים "לא נדרש".
    authority: contractor
    channel: email
    days: 14
    optional: true
    documents: [אישור חברת תקשורת]
    depends_on: [concrete_floor]

  - key: water_corp
    stage: finish
    track: water
    title: אישור חיבור למים וביוב מתאגיד המים
    description: ביישוב בלי תאגיד, המועצה או מקורות. ברשימות של חלק מהוועדות הוא לא מופיע.
    authority: water_corporation
    channel: portal
    days: 21
    optional: true
    documents: [אישור תאגיד המים]
    depends_on: [sewage_external, water_greywater]

  - key: developer_company
    stage: finish
    track: developer
    title: התייחסות החברה המפתחת
    description: בשכונה שחברה מפתחת או משרד הבינוי מפתחים. מופיעה על טופס הבקשה לביקורת.
    authority: municipality
    channel: email
    days: 14
    applies_if: [developer_neighborhood]
    documents: [התייחסות החברה המפתחת]
    depends_on: [as_made]

  - key: green_final
    stage: green
    title: אישור שלב ב׳ מהמעבדה לבנייה ירוקה
    authority: green_building_lab
    channel: email
    days: 21
    optional: true
    documents: [אישור שלב ב׳]
    depends_on: [green_check]

  # --- הגשה לטופס 4 ---
  - key: architect_supervision
    stage: form4
    title: דוח פיקוח עליון - עורך הבקשה (טופס ה-1)
    description: עורך הבקשה מאשר את שלבי הביקורת - סימון, במהלך הבנייה, גמר שלד, גמר בנייה.
    authority: architect
    channel: email
    days: 7
    documents: [דוח פיקוח עליון עורך הבקשה]
    depends_on: [as_made]

  - key: structure_supervision
    stage: form4
    title: דוח פיקוח עליון - מתכנן השלד (טופס ה-2)
    authority: structural_engineer
    channel: email
    days: 7
    documents: [דוח פיקוח עליון מתכנן השלד]
    depends_on: [concrete_summary]

  - key: contractor_declaration
    stage: form4
    title: הצהרת הקבלן הרשום (טופס ה-5)
    description: עם תעודת קבלן רשום בתוקף.
    authority: contractor
    channel: email
    days: 5
    optional: true
    documents: [הצהרת קבלן רשום, תעודת קבלן רשום]
    depends_on: [concrete_summary]

  - key: inspection_summary
    stage: form4
    title: דוח מסכם של האחראי לביקורת על הביצוע (טופס ה-7)
    description: כולל הודעה על פרטים שטרם הושלמו, אם יש.
    authority: supervising_engineer
